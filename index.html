<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>실시간 포커 분석기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-label="분석기 안내">
        <div>
          <p class="eyebrow">TEXAS HOLD'EM · REAL-TIME EQUITY</p>
          <h1>실시간 포커 분석기</h1>
          <p class="subtitle">카드를 입력·수정·삭제하면 승률을 자동으로 다시 계산합니다.</p>
        </div>
        <div class="live-panel">
          <div class="live-state" id="liveState" aria-live="polite"><span class="status-dot"></span><span id="statusText">LIVE ANALYSIS</span></div>
          <p id="updatedAt">준비 중...</p>
        </div>
      </section>

      <section class="layout">
        <section class="game-panel panel" aria-labelledby="tableTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">GAME STATE</p>
              <h2 id="tableTitle">현재 테이블</h2>
            </div>
            <div class="game-settings">
              <label class="player-count">총 플레이어
                <select id="playerCount" aria-label="총 플레이어 수"></select>
              </label>
              <label class="player-count">로컬 카드
                <select id="localCardCount" aria-label="로컬 카드 수"></select>
              </label>
              <label class="player-count">버린 카드
                <select id="deadCardCount" aria-label="버린 카드 수"></select>
              </label>
              <label class="player-count">플레이어당 카드
                <select id="playerCardCount" aria-label="플레이어당 카드 수"></select>
              </label>
            </div>
          </div>

          <div class="hint-card">
            <span>입력 형식</span>
            <strong>Sa, H4, D10</strong>
            <small>S·H·D·C + 숫자/A/K/Q/J &nbsp;·&nbsp; ? 또는 빈칸은 알 수 없는 카드</small>
          </div>

          <section class="board-section" aria-labelledby="boardTitle">
            <div class="row-label">
              <div><p class="eyebrow">LOCAL CARDS</p><h3 id="boardTitle">로컬 카드</h3></div>
              <span id="localCardCaption">0 / 5 CARDS</span>
            </div>
            <div class="card-inputs board-inputs" id="boardInputs"></div>
          </section>

          <section class="players-section" aria-labelledby="playersTitle">
            <div class="row-label">
              <div><p class="eyebrow">SEATS</p><h3 id="playersTitle">플레이어 카드</h3></div>
            </div>
            <div id="playersInputs" class="players-inputs"></div>
          </section>

          <section class="dead-section" aria-labelledby="deadTitle">
            <div class="row-label">
              <div><p class="eyebrow">DEAD CARDS</p><h3 id="deadTitle">버린 카드</h3></div>
              <span id="deadCardCaption">0 CARDS</span>
            </div>
            <div class="card-inputs dead-inputs" id="deadInputs"></div>
          </section>

          <p class="validation-message" id="validationMessage" role="status"></p>
        </section>

        <aside class="results-panel panel" aria-labelledby="resultTitle">
          <div class="section-heading results-heading">
            <div>
              <p class="eyebrow">LIVE ANALYSIS</p>
              <h2 id="resultTitle">승률</h2>
            </div>
            <span class="method-badge" id="methodBadge">WAITING</span>
          </div>
          <div class="results-list" id="resultsList" aria-live="polite"></div>
        </aside>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
